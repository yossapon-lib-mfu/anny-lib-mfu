<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>วงล้อสุ่มชั้นหนังสือ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap">
<style>
:root{--bg:#eaeef3;--card:#fff;--ink:#14213d;--mute:#5d6b82;--line:#d5dce6;--acc:#0f766e;--accink:#fff;--hi:#fff3c4}
@media(prefers-color-scheme:dark){:root{--bg:#0e1420;--card:#172033;--ink:#e7ecf4;--mute:#9aa8bf;--line:#2a364d;--acc:#2dd4bf;--accink:#05241f;--hi:#4a3d12}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai",system-ui,sans-serif;line-height:1.5}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:1.6rem;font-weight:800;margin:8px 0 0}h2{font-size:1.1rem;margin:0 0 12px}
.sub{color:var(--mute);margin:2px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 16px;cursor:pointer}
button.p{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chips button{font-size:1.05rem;padding:12px 18px}
.chips button.sel{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
.wheelwrap{display:grid;grid-template-columns:minmax(0,420px) 1fr;gap:18px;align-items:start}
@media(max-width:700px){.wheelwrap{grid-template-columns:1fr}}
.wb{position:relative;width:100%;max-width:420px;margin:0 auto}
.wb canvas{width:100%;height:auto;display:block}
.wb:before{content:"";position:absolute;top:-4px;left:50%;transform:translateX(-50%);z-index:2;border:14px solid transparent;border-top:28px solid var(--ink);border-bottom:0}
.left{list-style:none;margin:0;padding:0;font-size:.9rem}
.left li{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.dot{flex:none;width:24px;height:24px;border-radius:50%;color:#fff;font-weight:700;font-size:.8rem;display:grid;place-items:center}
.result{background:var(--hi);border:2px solid var(--acc);border-radius:14px;padding:16px;margin-bottom:14px;font-size:1.1rem}
.result b{font-size:1.25rem}
.banner{background:var(--hi);border-radius:10px;padding:10px 14px;margin-bottom:12px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
td.none{color:var(--mute)}
.note{color:var(--mute);font-size:.88rem}
footer{text-align:center;margin:10px 0 24px}
footer button{font-size:.8rem;padding:4px 10px;color:var(--mute)}
#conf{position:fixed;inset:0;pointer-events:none;z-index:9}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>🎡 วงล้อสุ่มชั้นหนังสือ</h1>
<p class="sub" id="sum">กำลังเชื่อมต่อฐานข้อมูล...</p>
<div id="msg"></div>
<div id="result" class="result" hidden></div>

<section class="card" id="pickBox">
  <h2>เลือกชื่อของคุณ</h2>
  <div class="chips" id="staff"></div>
  <button class="p" id="ok" disabled>ตกลง</button>
</section>

<section class="card" id="wheelBox" hidden>
  <h2 id="wtitle"></h2>
  <div class="wheelwrap">
    <div class="wb"><canvas id="wheel" width="840" height="840"></canvas></div>
    <div>
      <button class="p" id="spin" style="width:100%;font-size:1.15rem;padding:14px">หมุนวงล้อ</button>
      <button id="back" style="width:100%;margin:8px 0 12px">เปลี่ยนชื่อ</button>
      <b>ชั้นที่ยังเหลือ</b>
      <ul class="left" id="left"></ul>
    </div>
  </div>
</section>

<section class="card">
  <h2>ผลการจับคู่</h2>
  <div class="scroll"><table id="tbl"></table></div>
  <p class="note" id="remain"></p>
</section>

<section class="card" id="adminBar" hidden>
  <b>ส่วนผู้ดูแล</b>
  <p class="note">กดปุ่ม "ลบ" ในตารางเพื่อลบรายการที่บันทึกผิด หรือรีเซ็ตทั้งหมดเพื่อเริ่มใหม่</p>
  <button id="reset">รีเซ็ตผลทั้งหมด</button>
</section>
<footer><button id="adminBtn">ผู้ดูแล</button></footer>
</main>
<canvas id="conf"></canvas>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getDatabase,ref,onValue,runTransaction,remove} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

/* ===== ตั้งค่า: นำค่าจาก Firebase Console (Project settings > Your apps > Web app) มาใส่แทนค่า YOUR_... ===== */
const firebaseConfig={
  apiKey:"AIzaSyCZ7eJTJw2ApudzVCyabISyudFXOq8eQK4",
  authDomain:"randombook-fb2d5.firebaseapp.com",
  databaseURL:"https://randombook-fb2d5-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"randombook-fb2d5",
  appId:"1:550945414761:web:a187992ce2586b326a4cf8"
};
const ADMIN_PASS="1234"; // เปลี่ยนรหัสผู้ดูแล (ใครเปิดดูซอร์สโค้ดก็เห็นได้ ใช้กันกดพลาดเท่านั้น)

const STAFF=["วิภาดา","เอกชัย","สุนทรีย์","เบญจวรรณ","ทักษ์ดนัย","จันทร์จิรา","เศรษฐรุจิ","ยสพนต์","วุฒิไกร"].map((n,i)=>({id:"s"+(i+1),name:n}));
const SHELVES=[
 "(ชั้น 4) หนังสือภาษาอังกฤษ ตู้ที่ 1-12 และหนังสืออ้างอิงภาษาอังกฤษ ตู้ที่ 1",
 "(ชั้น 4) หนังสือภาษาอังกฤษ ตู้ที่ 13-24",
 "(ชั้น 4) หนังสือภาษาอังกฤษ ตู้ที่ 25-36",
 "(ชั้น 4) หนังสือภาษาไทย ตู้ที่ 1-13 และหนังสืออ้างอิงภาษาไทย ตู้ที่ 1",
 "(ชั้น 4) หนังสือภาษาไทย ตู้ที่ 14-27",
 "(ชั้น 5) หนังสือกฎหมาย ตู้ที่ 1-12 และหนังสือวิจัย/วิทยานิพนธ์/รายงาน ตู้ที่ 1-3",
 "(ชั้น 5) หนังสืออ้างอิงกฎหมาย+ราชกิจจานุเบกษา ตู้ที่ 1-8 และหนังสือทางการแพทย์ภาษาไทย ตู้ที่ 1-6",
 "(ชั้น 5) หนังสือทางการแพทย์ภาษาอังกฤษ ตู้ที่ 1-13, หนังสืออ้างอิงทางการแพทย์ ตู้ที่ 1",
 "(ชั้น 5) หนังสือภาษาจีน ตู้ที่ 1-9 / หนังสือแพทย์ภาษาจีน ตู้ที่ 1-2 / และหนังสืออ้างอิงภาษาจีน"
].map((t,i)=>({id:i+1,text:t}));
const COL=["#c0392b","#d35400","#9a7d0a","#1e8449","#148f77","#2471a3","#6c3483","#ad1457","#566573"];

const $=i=>document.getElementById(i), TAU=Math.PI*2;
const rand=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n};
const fmt=ts=>new Date(ts).toLocaleString("th-TH",{timeZone:"Asia/Bangkok",dateStyle:"medium",timeStyle:"short"});
let asg={},taken={},conn=false,got={a:false,t:false},sel=null,confirmed=false,spinning=false,admin=false,rot=0,db=null,lastResult="";
const cfgMissing=firebaseConfig.apiKey.startsWith("YOUR_");

const avail=()=>SHELVES.filter(s=>!taken[s.id]);
const ready=()=>!cfgMissing&&conn&&got.a&&got.t;

function banner(t){$("msg").innerHTML=t?'<div class="banner"></div>':"";if(t)$("msg").firstChild.textContent=t}

function draw(list,r){
  const c=$("wheel"),x=c.getContext("2d"),S=c.width,R=S/2-8;
  x.clearRect(0,0,S,S);x.save();x.translate(S/2,S/2);x.rotate(r);
  const a=TAU/list.length;
  list.forEach((s,i)=>{
    x.beginPath();x.moveTo(0,0);x.arc(0,0,R,i*a,(i+1)*a);x.closePath();
    x.fillStyle=COL[(s.id-1)%COL.length];x.fill();x.strokeStyle="#fff";x.lineWidth=4;x.stroke();
    x.save();x.rotate(i*a+a/2);x.fillStyle="#fff";x.font='800 '+(S*0.1)+'px "Noto Sans Thai",sans-serif';x.textAlign="center";x.textBaseline="middle";x.fillText(s.id,R*0.66,0);x.restore();
  });
  x.beginPath();x.arc(0,0,S*0.05,0,TAU);x.fillStyle="#fff";x.fill();x.restore();
}

function spinTo(list,idx){
  return new Promise(res=>{
    const a=TAU/list.length,start=rot,cur=((start%TAU)+TAU)%TAU;
    const base=-Math.PI/2-(idx+.5)*a+(Math.random()-.5)*a*.6;
    const delta=(((base-cur)%TAU)+TAU)%TAU+TAU*(5+rand(3)),dur=5200,t0=performance.now();
    (function f(t){
      const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);
      rot=start+delta*e;draw(list,rot);
      p<1?requestAnimationFrame(f):res();
    })(t0);
  });
}

function confetti(){
  const c=$("conf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const ps=Array.from({length:140},()=>({x:innerWidth/2,y:innerHeight*0.4,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,s:5+Math.random()*6,c:COL[rand(COL.length)],r:Math.random()*TAU}));
  const t0=performance.now();
  (function f(t){
    const k=(t-t0)/2800;x.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.globalAlpha=Math.max(0,1-k);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
    if(k<1)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height);
  })(t0);
}

function renderTable(){
  const done=STAFF.filter(s=>asg[s.id]).length;
  $("sum").textContent=cfgMissing?"ยังไม่ได้ตั้งค่า Firebase":"จับคู่แล้ว "+done+"/"+STAFF.length+" คน";
  const t=$("tbl");t.innerHTML="";
  const hr=t.insertRow();["เจ้าหน้าที่","ชั้นหนังสือที่ได้รับผิดชอบ","วันและเวลาที่สุ่ม"].concat(admin?[""]:[]).forEach(h=>{const th=document.createElement("th");th.textContent=h;hr.appendChild(th)});
  STAFF.forEach(s=>{
    const r=t.insertRow(),a=asg[s.id];
    r.insertCell().textContent=s.name;
    const c1=r.insertCell(),c2=r.insertCell();
    if(a){c1.textContent=a.shelfId+". "+a.shelfText;c2.textContent=fmt(a.ts)}else{c1.textContent="ยังไม่ได้สุ่ม";c2.textContent="-";c1.className=c2.className="none"}
    if(admin){const c=r.insertCell();if(a){const b=document.createElement("button");b.textContent="ลบ";b.onclick=()=>delOne(s.id);c.appendChild(b)}}
  });
  const left=STAFF.filter(s=>!asg[s.id]).map(s=>s.name);
  $("remain").textContent=left.length?"ยังไม่ได้สุ่ม: "+left.join(", "):"จับคู่ครบทุกคนแล้ว 🎉";
}

function renderMain(){
  if(spinning)return;
  const rem=STAFF.filter(s=>!asg[s.id]);
  if(sel&&asg[sel]){sel=null;confirmed=false}
  const box=$("staff");box.innerHTML="";
  rem.forEach(s=>{const b=document.createElement("button");b.textContent=s.name;b.className=sel===s.id?"sel":"";b.disabled=confirmed;b.onclick=()=>{sel=s.id;lastResult="";$("result").hidden=true;renderMain()};box.appendChild(b)});
  if(!rem.length){box.textContent="จับคู่ครบทุกคนแล้ว 🎉"}
  $("ok").disabled=!sel||confirmed||!ready();
  $("ok").hidden=!rem.length;
  const showW=confirmed&&sel;
  $("wheelBox").hidden=!showW;
  if(showW){
    const list=avail();
    $("wtitle").textContent=STAFF.find(s=>s.id===sel).name+" กดหมุนวงล้อได้เลย";
    $("spin").disabled=!ready()||!list.length;
    $("left").innerHTML="";
    list.forEach(s=>{const li=document.createElement("li"),d=document.createElement("span"),tx=document.createElement("span");d.className="dot";d.style.background=COL[(s.id-1)%COL.length];d.textContent=s.id;tx.textContent=s.text;li.append(d,tx);$("left").appendChild(li)});
    if(list.length)draw(list,rot);
  }
  if(cfgMissing)banner("ยังไม่ได้ใส่ค่า firebaseConfig ในไฟล์ จึงยังหมุนวงล้อไม่ได้");
  else if(!ready())banner("กำลังเชื่อมต่อฐานข้อมูล ปุ่มหมุนจะใช้ได้เมื่อเชื่อมต่อสำเร็จ");
  else banner("");
}

async function doSpin(){
  if(spinning||!ready()||!sel)return;
  spinning=true;$("spin").disabled=true;$("back").disabled=true;banner("");
  const me=STAFF.find(s=>s.id===sel),frozen=avail();
  let pick=null,pool=frozen.slice();
  try{
    while(pool.length){
      const c=pool[rand(pool.length)];
      const r=await runTransaction(ref(db,"shelfTaken/"+c.id),cur=>cur===null?{staffId:me.id,ts:Date.now()}:undefined);
      if(r.committed){pick=c;break}
      pool=pool.filter(x=>x!==c);
    }
    if(!pick)throw new Error("ไม่มีชั้นว่างเหลือ");
    const rec={staff:me.name,shelfId:pick.id,shelfText:pick.text,ts:Date.now()};
    const r2=await runTransaction(ref(db,"assignments/"+me.id),cur=>cur===null?rec:undefined);
    if(!r2.committed){await remove(ref(db,"shelfTaken/"+pick.id));throw new Error("คุณถูกจับคู่ไปแล้ว")}
  }catch(e){
    spinning=false;$("back").disabled=false;banner("บันทึกไม่สำเร็จ: "+(e&&e.message||e));renderMain();return;
  }
  await spinTo(frozen,frozen.indexOf(pick));
  lastResult=me.name+"|"+pick.id+". "+pick.text;
  $("result").innerHTML="";
  const p=document.createElement("div");p.append(me.name+" ได้รับผิดชอบ: ");const b=document.createElement("b");b.textContent=pick.id+". "+pick.text;p.appendChild(b);$("result").appendChild(p);
  $("result").hidden=false;confetti();
  spinning=false;$("back").disabled=false;sel=null;confirmed=false;renderTable();renderMain();
}

async function delOne(sid){
  const a=asg[sid];if(!a)return;
  try{await Promise.all([remove(ref(db,"assignments/"+sid)),remove(ref(db,"shelfTaken/"+a.shelfId))])}catch(e){banner("ลบไม่สำเร็จ: "+e.message)}
}

$("ok").onclick=()=>{if(sel){confirmed=true;renderMain()}};
$("back").onclick=()=>{if(!spinning){confirmed=false;sel=null;renderMain()}};
$("spin").onclick=doSpin;
$("adminBtn").onclick=()=>{
  if(admin){admin=false}else{const p=prompt("รหัสผู้ดูแล");if(p!==ADMIN_PASS)return;admin=true}
  $("adminBar").hidden=!admin;renderTable();
};
let armed=false;
$("reset").onclick=async e=>{
  if(!armed){armed=true;e.target.textContent="กดอีกครั้งเพื่อยืนยันรีเซ็ต";setTimeout(()=>{armed=false;e.target.textContent="รีเซ็ตผลทั้งหมด"},3500);return}
  armed=false;e.target.textContent="รีเซ็ตผลทั้งหมด";
  try{await Promise.all([...Object.keys(asg).map(k=>remove(ref(db,"assignments/"+k))),...Object.keys(taken).map(k=>remove(ref(db,"shelfTaken/"+k)))])}catch(err){banner("รีเซ็ตไม่สำเร็จ: "+err.message)}
};

if(!cfgMissing){
  db=getDatabase(initializeApp(firebaseConfig));
  onValue(ref(db,".info/connected"),s=>{conn=!!s.val();renderMain()});
  onValue(ref(db,"assignments"),s=>{asg=s.val()||{};got.a=true;renderTable();renderMain()},e=>banner("อ่านข้อมูลไม่สำเร็จ: "+e.message));
  onValue(ref(db,"shelfTaken"),s=>{taken=s.val()||{};got.t=true;renderMain()},e=>banner("อ่านข้อมูลไม่สำเร็จ: "+e.message));
}
renderTable();renderMain();
</script>
</body>
</html>
